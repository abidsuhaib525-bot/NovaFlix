[package]
name = "novaflix"
exclude = [
    "docs/",
    "Formula/",
    "bucket/",
    ".github/",
    ".githooks/",
    ".cargo/",
    "web/node_modules/",
    "web/dist/",
    "install.sh",
    "install.ps1",
    "CONTRIBUTING.md",
    ".gitignore",
    "book.toml",
    "book/",
]
version = "0.2.0"
edition = "2024"
description = "Modern cinema-grade web streaming platform with ultra-low latency, multi-source resolution switching, and resilient media playback."
repository = "https://github.com/abidsuhaib525-bot/NovaFlix"
license = "MIT OR Apache-2.0"
keywords = ["web", "novaflix", "streaming", "movies", "shaka-player"]
categories = ["web-programming::http-server", "multimedia"]
readme = "README.md"
rust-version = "1.90.0"

[dependencies]
# --- HTTP server ---------------------------------------------------------
axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "cors",
    # `fs` unlocks ServeDir/ServeFile, which is how the built SPA is served
    # from the same port as the API.
    "fs",
    "compression-gzip",
    "trace",
    "limit",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
async-trait = "0.1.92"
dashmap = "6.1.0"
uuid = { version = "1", features = ["v4"] }

# --- Core (unchanged from the TUI project) --------------------------------
base64 = "0.23.0"
rmp-serde = "1.3.1"
dirs = "7.0.0"
futures = "0.3.34"
hmac = "0.13.0"
md-5 = "0.11.0"
rand = "0.10.2"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "signal",
    "net",
    "process",
] }
url = "2.5.8"
percent-encoding = "2.3.2"
log = "0.4.33"
flexi_logger = "0.31.10"
reqwest = { version = "0.12.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
    "stream",
] }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
] }
lru = "0.18.1"
tempfile = "3.17.1"

[lib]
name = "moviebox_web"
path = "src/lib.rs"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
nonminimal_bool = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = "0.1.52"