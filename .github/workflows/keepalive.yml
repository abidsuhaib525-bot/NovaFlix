name: Blitz Cloud Keepalive 24/7 (Real Browser Engine)

on:
  schedule:
    # Run every 15 minutes (Blitz Cloud Free plan sleeps after 30 mins of no browser visitors)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Emulate Real Browser Session & Wakeup
    runs-on: ubuntu-latest
    steps:
      - name: Document Navigation Curl Ping
        run: |
          echo "=== Step 1: Document Navigation Ping with Chrome Headers ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-User: ?1" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            https://123.fluxcode.blitz.cloud/

      - name: Run Headless Chromium via Playwright
        run: |
          echo "=== Step 2: Launch Real Chromium Engine (Runs Turnstile & Beacon Scripts) ==="
          npx --yes playwright install --with-deps chromium
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            console.log("Launching Chromium engine...");
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              viewport: { width: 1280, height: 720 }
            });
            const page = await context.newPage();
            
            console.log("Opening https://123.fluxcode.blitz.cloud/ as real browser...");
            const response = await page.goto("https://123.fluxcode.blitz.cloud/", {
              waitUntil: "networkidle",
              timeout: 60000
            });
            console.log("Navigation response status:", response ? response.status() : "no-response");
            
            // Wait 8 seconds to allow Cloudflare Turnstile & Blitz beacon scripts to report back
            await page.waitForTimeout(8000);
            
            const title = await page.title();
            console.log("Rendered Page Title:", title);
            
            // Call API health from within the genuine browser session
            const health = await page.evaluate(async () => {
              try {
                const res = await fetch("/api/health");
                return await res.json();
              } catch (err) {
                return { error: String(err) };
              }
            });
            console.log("Health Check Result:", JSON.stringify(health));
            
            await browser.close();
            console.log("SUCCESS: Blitz Cloud container verified awake and 30-min idle timer reset!");
          })().catch(err => {
            console.error("Keepalive execution error:", err);
            process.exit(1);
          });
          '
